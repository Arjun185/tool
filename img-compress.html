<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Compress your images online with our fully responsive image compression tool. Optimize images for web use with adjustable compression levels.">
    <meta name="keywords" content="image compression, optimize images, image optimizer, compress images online">
    <meta name="author" content="Your Name">
    <title>Image Compression Tool</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
            line-height: 1.6;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            background-color: #4a90e2;
            color: #fff;
            padding: 40px 0;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
        }

        header p {
            margin: 10px 0 0;
            font-size: 1.2rem;
        }

        /* Compression Tool */
        #compression-tool {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            margin: 20px 0;
        }

        .upload-section {
            margin-bottom: 20px;
        }

        .upload-label {
            display: inline-block;
            padding: 15px 30px;
            background-color: #4a90e2;
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .upload-label:hover {
            background-color: #357abd;
        }

        .upload-label input[type="file"] {
            display: none;
        }

        .compression-controls {
            margin: 20px 0;
        }

        .compression-controls label {
            font-size: 1.1rem;
            margin-bottom: 10px;
            display: block;
        }

        .compression-controls input[type="range"] {
            width: 100%;
            max-width: 300px;
            margin: 10px 0;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #4a90e2;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #357abd;
        }

        .download-btn {
            margin-top: 20px;
            text-decoration: none;
        }

        /* Output Section */
        #output {
            margin-top: 30px;
        }

        #compressedImage {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* Ad Sections */
        .ad-section {
            margin: 30px 0;
            text-align: center;
        }

        /* Footer */
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 20px 0;
            margin-top: 40px;
        }

        footer p {
            margin: 0;
            font-size: 0.9rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }

            header p {
                font-size: 1rem;
            }

            .upload-label {
                padding: 10px 20px;
            }

            .btn {
                padding: 8px 16px;
                font-size: 0.9rem;
            }
        }
    </style>
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-YOUR_AD_SENSE_ID" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <div class="container">
            <h1>Image Compression Tool</h1>
            <p>Optimize your images for the web with ease.</p>
        </div>
    </header>

    <main class="container">
        <!-- Top Ad Unit -->
        <section id="ad-top" class="ad-section">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-YOUR_AD_SENSE_ID"
                 data-ad-slot="1234567890"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </section>

        <!-- Compression Tool -->
        <section id="compression-tool">
            <div class="upload-section">
                <label for="imageInput" class="upload-label">
                    <span>Choose an Image</span>
                    <input type="file" id="imageInput" accept="image/*">
                </label>
            </div>

            <div class="compression-controls">
                <label for="compressionLevel">Compression Level: <span id="compressionValue">0.5</span></label>
                <input type="range" id="compressionLevel" min="0" max="1" step="0.1" value="0.5">
            </div>

            <button id="compressBtn" class="btn">Compress Image</button>

            <div id="output" class="output-section">
                <img id="compressedImage" src="" alt="Compressed Image">
                <a id="downloadLink" href="#" download="compressed_image.jpg" class="btn download-btn">Download Compressed Image</a>
            </div>
        </section>

        <!-- Bottom Ad Unit -->
        <section id="ad-bottom" class="ad-section">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-YOUR_AD_SENSE_ID"
                 data-ad-slot="0987654321"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2023 Image Compression Tool. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // JavaScript for Image Compression
        document.getElementById('compressionLevel').addEventListener('input', function() {
            document.getElementById('compressionValue').textContent = this.value;
        });

        document.getElementById('compressBtn').addEventListener('click', function() {
            const file = document.getElementById('imageInput').files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const compressionLevel = parseFloat(document.getElementById('compressionLevel').value);
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);
                        const compressedImage = canvas.toDataURL('image/jpeg', compressionLevel);
                        document.getElementById('compressedImage').src = compressedImage;
                        document.getElementById('downloadLink').href = compressedImage;
                    };
                };
                reader.readAsDataURL(file);
            } else {
                alert('Please select an image file.');
            }
        });
    </script>
</body>
</html>
