<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A multi-functional web tool for image compression, age calculation, interest calculation, and EMI calculation.">
    <meta name="keywords" content="image compression, age calculator, interest calculator, EMI calculator">
    <meta name="author" content="Your Name">
    <title>Multi-Functional Web Tool</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* CSS Styles */
        :root {
            --primary-color: #4CAF50;
            --secondary-color: #45a049;
            --background-light: #f5f7fa;
            --background-dark: #1e1e1e;
            --text-light: #333;
            --text-dark: #f5f7fa;
            --card-light: white;
            --card-dark: #2c2c2c;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: var(--background-light);
            color: var(--text-light);
            transition: background 0.5s ease, color 0.5s ease;
        }

        body.dark-mode {
            background: var(--background-dark);
            color: var(--text-dark);
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
        }

        main {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        section {
            background: var(--card-light);
            padding: 2rem;
            margin-bottom: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.5s ease;
        }

        body.dark-mode section {
            background: var(--card-dark);
        }

        section:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        h2 {
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        input, select, button {
            margin: 0.5rem 0;
            padding: 0.75rem;
            width: 100%;
            max-width: 400px;
            display: block;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
        }

        button {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease, transform 0.3s ease;
        }

        button:hover {
            background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
            transform: translateY(-2px);
        }

        .ads {
            margin: 2rem 0;
            text-align: center;
        }

        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 1rem;
            position: fixed;
            bottom: 0;
            width: 100%;
            box-shadow: 0 -4px 6px rgba(0, 0, 0, 0.1);
        }

        footer p {
            margin: 0;
        }

        #compressed-image-container img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
            margin-top: 1rem;
        }

        .result {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-top: 1rem;
        }

        /* Dark Mode Toggle */
        .dark-mode-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: var(--card-light);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.5s ease;
        }

        body.dark-mode .dark-mode-toggle {
            background: var(--card-dark);
        }

        .dark-mode-toggle i {
            color: var(--text-light);
            font-size: 1.2rem;
            transition: color 0.5s ease;
        }

        body.dark-mode .dark-mode-toggle i {
            color: var(--text-dark);
        }

        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            z-index: -1;
            animation: animateBackground 10s infinite alternate;
        }

        body.dark-mode::before {
            background: linear-gradient(135deg, #1e1e1e, #2c2c2c);
        }

        @keyframes animateBackground {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.1);
            }
        }
    </style>
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-YOUR_AD_SENSE_ID" crossorigin="anonymous"></script>
</head>
<body>
    <!-- Dark Mode Toggle -->
    <button class="dark-mode-toggle" id="dark-mode-toggle">
        <i class="fas fa-moon"></i>
    </button>

    <header>
        <h1>Multi-Functional Web Tool</h1>
    </header>

    <main>
        <!-- Image Compression Tool -->
        <section id="image-compression">
            <h2><i class="fas fa-image"></i> Image Compression Tool</h2>
            <input type="file" id="image-input" accept="image/*">
            <label for="compression-level">Compression Level:</label>
            <select id="compression-level">
                <option value="0.1">Low</option>
                <option value="0.5">Medium</option>
                <option value="0.9">High</option>
            </select>
            <button id="compress-btn">Compress Image</button>
            <div id="compressed-image-container"></div>
            <button id="download-btn" style="display: none;">Download Compressed Image</button>
        </section>

        <!-- Age Calculator -->
        <section id="age-calculator">
            <h2><i class="fas fa-birthday-cake"></i> Age Calculator</h2>
            <label for="birthdate">Enter your birthdate:</label>
            <input type="date" id="birthdate">
            <button id="calculate-age">Calculate Age</button>
            <p class="result" id="age-result"></p>
        </section>

        <!-- Interest Calculator -->
        <section id="interest-calculator">
            <h2><i class="fas fa-percentage"></i> Interest Calculator</h2>
            <label for="principal">Principal Amount:</label>
            <input type="number" id="principal" placeholder="Enter principal amount">
            <label for="rate">Interest Rate (%):</label>
            <input type="number" id="rate" placeholder="Enter interest rate">
            <label for="time-years">Time (years):</label>
            <input type="number" id="time-years" placeholder="Years">
            <label for="time-months">Time (months):</label>
            <input type="number" id="time-months" placeholder="Months">
            <label for="time-days">Time (days):</label>
            <input type="number" id="time-days" placeholder="Days">
            <button id="calculate-interest">Calculate Interest</button>
            <p class="result" id="interest-amount"></p>
            <p class="result" id="total-amount"></p>
        </section>

        <!-- EMI Calculator -->
        <section id="emi-calculator">
            <h2><i class="fas fa-calculator"></i> EMI Calculator</h2>
            <label for="loan-amount">Loan Amount:</label>
            <input type="number" id="loan-amount" placeholder="Enter loan amount">
            <label for="interest-rate">Interest Rate (%):</label>
            <input type="number" id="interest-rate" placeholder="Enter interest rate">
            <label for="loan-tenure">Loan Tenure (months):</label>
            <input type="number" id="loan-tenure" placeholder="Enter loan tenure">
            <button id="calculate-emi">Calculate EMI</button>
            <p class="result" id="emi-result"></p>
        </section>

        <!-- AdSense Ad Unit -->
        <section id="advertisement">
            <h2><i class="fas fa-ad"></i> Advertisement</h2>
            <div class="ads">
                <!-- Paste your Google AdSense ad unit code here -->
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-YOUR_AD_SENSE_ID"
                     data-ad-slot="YOUR_AD_SLOT_ID"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script>
                    (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 Your Company. All rights reserved.</p>
    </footer>

    <script>
        // Dark Mode Toggle
        const darkModeToggle = document.getElementById('dark-mode-toggle');
        const body = document.body;

        darkModeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const icon = darkModeToggle.querySelector('i');
            if (body.classList.contains('dark-mode')) {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            }
        });

        // Image Compression and Download
        const downloadBtn = document.getElementById('download-btn');
        let compressedImageUrl = null;

        document.getElementById('compress-btn').addEventListener('click', function () {
            const file = document.getElementById('image-input').files[0];
            const compressionLevel = parseFloat(document.getElementById('compression-level').value);

            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = new Image();
                    img.src = e.target.result;

                    img.onload = function () {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = img.width * compressionLevel;
                        canvas.height = img.height * compressionLevel;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                        compressedImageUrl = canvas.toDataURL('image/jpeg', compressionLevel);
                        const compressedImgElement = document.createElement('img');
                        compressedImgElement.src = compressedImageUrl;
                        document.getElementById('compressed-image-container').innerHTML = '';
                        document.getElementById('compressed-image-container').appendChild(compressedImgElement);

                        // Show download button
                        downloadBtn.style.display = 'block';
                    };
                };
                reader.readAsDataURL(file);
            }
        });

        downloadBtn.addEventListener('click', function () {
            if (compressedImageUrl) {
                const link = document.createElement('a');
                link.href = compressedImageUrl;
                link.download = 'compressed-image.jpg';
                link.click();
            }
        });

        // Age Calculator (Years, Months, Days)
        document.getElementById('calculate-age').addEventListener('click', function () {
            const birthdate = new Date(document.getElementById('birthdate').value);
            const today = new Date();

            let years = today.getFullYear() - birthdate.getFullYear();
            let months = today.getMonth() - birthdate.getMonth();
            let days = today.getDate() - birthdate.getDate();

            // Adjust months and years if necessary
            if (months < 0 || (months === 0 && days < 0)) {
                years--;
                months += 12;
            }

            // Adjust days if necessary
            if (days < 0) {
                const lastMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                days += lastMonth.getDate();
                months--;
            }

            document.getElementById('age-result').innerText = `Your age is ${years} years, ${months} months, and ${days} days.`;
        });

        // Interest Calculator
        document.getElementById('calculate-interest').addEventListener('click', function () {
            const principal = parseFloat(document.getElementById('principal').value);
            const rate = parseFloat(document.getElementById('rate').value);
            const years = parseFloat(document.getElementById('time-years').value) || 0;
            const months = parseFloat(document.getElementById('time-months').value) || 0;
            const days = parseFloat(document.getElementById('time-days').value) || 0;

            // Convert time to years
            const totalYears = years + (months / 12) + (days / 365);

            if (principal > 0 && rate > 0 && totalYears > 0) {
                const interest = (principal * rate * totalYears) / 100;
                const totalAmount = principal + interest;

                document.getElementById('interest-amount').innerText = `Interest Amount: ₹${interest.toFixed(2)}`;
                document.getElementById('total-amount').innerText = `Total Amount: ₹${totalAmount.toFixed(2)}`;
            } else {
                document.getElementById('interest-amount').innerText = 'Please enter valid values.';
                document.getElementById('total-amount').innerText = '';
            }
        });

        // EMI Calculator
        document.getElementById('calculate-emi').addEventListener('click', function () {
            const loanAmount = parseFloat(document.getElementById('loan-amount').value);
            const interestRate = parseFloat(document.getElementById('interest-rate').value);
            const loanTenure = parseFloat(document.getElementById('loan-tenure').value);
            const monthlyInterestRate = (interestRate / 100) / 12;
            const emi = (loanAmount * monthlyInterestRate * Math.pow(1 + monthlyInterestRate, loanTenure)) / (Math.pow(1 + monthlyInterestRate, loanTenure) - 1);
            document.getElementById('emi-result').innerText = `EMI: ₹${emi.toFixed(2)}`;
        });
    </script>
</body>
</html>
