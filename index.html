<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A multi-functional web tool for image compression, age calculation, date difference, EMI, and interest calculation.">
    <meta name="keywords" content="image compression, age calculator, date calculator, EMI calculator, interest calculator">
    <meta name="author" content="Your Name">
    <title>Multi-Functional Web Tool</title>
    <style>
        /* CSS Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            color: #333;
        }

        header {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
        }

        main {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        section {
            background: white;
            padding: 2rem;
            margin-bottom: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        section:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        h2 {
            color: #4CAF50;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        input, select, button {
            margin: 0.5rem 0;
            padding: 0.75rem;
            width: 100%;
            max-width: 400px;
            display: block;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input:focus, select:focus {
            border-color: #4CAF50;
            outline: none;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
        }

        button {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease, transform 0.3s ease;
        }

        button:hover {
            background: linear-gradient(135deg, #45a049, #4CAF50);
            transform: translateY(-2px);
        }

        .ads {
            margin: 2rem 0;
            text-align: center;
        }

        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 1rem;
            position: fixed;
            bottom: 0;
            width: 100%;
            box-shadow: 0 -4px 6px rgba(0, 0, 0, 0.1);
        }

        footer p {
            margin: 0;
        }

        #compressed-image-container img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
            margin-top: 1rem;
        }

        .result {
            font-size: 1.2rem;
            font-weight: bold;
            color: #4CAF50;
            margin-top: 1rem;
        }
    </style>
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-YOUR_AD_SENSE_ID" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <h1>Multi-Functional Web Tool</h1>
    </header>

    <main>
        <!-- Image Compression Tool -->
        <section id="image-compression">
            <h2>Image Compression Tool</h2>
            <input type="file" id="image-input" accept="image/*">
            <label for="compression-level">Compression Level:</label>
            <select id="compression-level">
                <option value="0.1">Low</option>
                <option value="0.5">Medium</option>
                <option value="0.9">High</option>
            </select>
            <button id="compress-btn">Compress Image</button>
            <div id="compressed-image-container"></div>
        </section>

        <!-- Age Calculator -->
        <section id="age-calculator">
            <h2>Age Calculator</h2>
            <label for="birthdate">Enter your birthdate:</label>
            <input type="date" id="birthdate">
            <button id="calculate-age">Calculate Age</button>
            <p class="result" id="age-result"></p>
        </section>

        <!-- Date Difference Calculator -->
        <section id="date-difference">
            <h2>Date Difference Calculator</h2>
            <label for="start-date">Start Date:</label>
            <input type="date" id="start-date">
            <label for="end-date">End Date:</label>
            <input type="date" id="end-date">
            <button id="calculate-difference">Calculate Difference</button>
            <p class="result" id="difference-result"></p>
        </section>

        <!-- EMI Calculator -->
        <section id="emi-calculator">
            <h2>EMI Calculator</h2>
            <label for="loan-amount">Loan Amount:</label>
            <input type="number" id="loan-amount" placeholder="Enter loan amount">
            <label for="interest-rate">Interest Rate (%):</label>
            <input type="number" id="interest-rate" placeholder="Enter interest rate">
            <label for="loan-tenure">Loan Tenure (months):</label>
            <input type="number" id="loan-tenure" placeholder="Enter loan tenure">
            <button id="calculate-emi">Calculate EMI</button>
            <p class="result" id="emi-result"></p>
        </section>

        <!-- Interest Calculator -->
        <section id="interest-calculator">
            <h2>Interest Calculator</h2>
            <label for="principal">Principal Amount:</label>
            <input type="number" id="principal" placeholder="Enter principal amount">
            <label for="rate">Interest Rate (%):</label>
            <input type="number" id="rate" placeholder="Enter interest rate">
            <label for="time">Time (years):</label>
            <input type="number" id="time" placeholder="Enter time in years">
            <button id="calculate-interest">Calculate Interest</button>
            <p class="result" id="interest-result"></p>
        </section>

        <!-- AdSense Ad Unit -->
        <section id="advertisement">
            <h2>Advertisement</h2>
            <div class="ads">
                <!-- Paste your Google AdSense ad unit code here -->
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-YOUR_AD_SENSE_ID"
                     data-ad-slot="YOUR_AD_SLOT_ID"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script>
                    (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 Your Company. All rights reserved.</p>
    </footer>

    <script>
        // JavaScript Functionality (Same as before)
        // Image Compression
        document.getElementById('compress-btn').addEventListener('click', function () {
            const file = document.getElementById('image-input').files[0];
            const compressionLevel = parseFloat(document.getElementById('compression-level').value);

            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = new Image();
                    img.src = e.target.result;

                    img.onload = function () {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = img.width * compressionLevel;
                        canvas.height = img.height * compressionLevel;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                        const compressedImage = canvas.toDataURL('image/jpeg', compressionLevel);
                        const compressedImgElement = document.createElement('img');
                        compressedImgElement.src = compressedImage;
                        document.getElementById('compressed-image-container').innerHTML = '';
                        document.getElementById('compressed-image-container').appendChild(compressedImgElement);
                    };
                };
                reader.readAsDataURL(file);
            }
        });

        // Age Calculator (Years, Months, Days)
        document.getElementById('calculate-age').addEventListener('click', function () {
            const birthdate = new Date(document.getElementById('birthdate').value);
            const today = new Date();

            let years = today.getFullYear() - birthdate.getFullYear();
            let months = today.getMonth() - birthdate.getMonth();
            let days = today.getDate() - birthdate.getDate();

            // Adjust months and years if necessary
            if (months < 0 || (months === 0 && days < 0)) {
                years--;
                months += 12;
            }

            // Adjust days if necessary
            if (days < 0) {
                const lastMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                days += lastMonth.getDate();
                months--;
            }

            document.getElementById('age-result').innerText = `Your age is ${years} years, ${months} months, and ${days} days.`;
        });

        // Date Difference Calculator
        document.getElementById('calculate-difference').addEventListener('click', function () {
            const startDate = new Date(document.getElementById('start-date').value);
            const endDate = new Date(document.getElementById('end-date').value);
            const differenceInTime = endDate.getTime() - startDate.getTime();
            const differenceInDays = Math.floor(differenceInTime / (1000 * 3600 * 24));
            document.getElementById('difference-result').innerText = `Difference: ${differenceInDays} days.`;
        });

        // EMI Calculator
        document.getElementById('calculate-emi').addEventListener('click', function () {
            const loanAmount = parseFloat(document.getElementById('loan-amount').value);
            const interestRate = parseFloat(document.getElementById('interest-rate').value);
            const loanTenure = parseFloat(document.getElementById('loan-tenure').value);
            const monthlyInterestRate = (interestRate / 100) / 12;
            const emi = (loanAmount * monthlyInterestRate * Math.pow(1 + monthlyInterestRate, loanTenure)) / (Math.pow(1 + monthlyInterestRate, loanTenure) - 1);
            document.getElementById('emi-result').innerText = `EMI: ₹${emi.toFixed(2)}`;
        });

        // Interest Calculator
        document.getElementById('calculate-interest').addEventListener('click', function () {
            const principal = parseFloat(document.getElementById('principal').value);
            const rate = parseFloat(document.getElementById('rate').value);
            const time = parseFloat(document.getElementById('time').value);
            const interest = (principal * rate * time) / 100;
            document.getElementById('interest-result').innerText = `Interest: ₹${interest.toFixed(2)}`;
        });
    </script>
</body>
</html>
